# Reusable 20-demo SFT recipe for one selected LIBERO-Spatial task.
# The concrete dataset and experiment name are supplied by the launcher.
defaults:
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-0

runner:
  task_type: sft
  logger:
    log_path: /path/to/output
    project_name: pi05-libero-ablation
    experiment_name: task_sft20
    logger_backends: ["tensorboard"]
  max_epochs: -1
  max_steps: 500
  val_check_interval: -1
  save_interval: 250

data:
  train_data_paths: /path/to/task_train20

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 8
  global_batch_size: 8
  seed: 42
  model:
    precision: null
    model_path: /path/to/public_pi05_sft
    num_action_chunks: 4
    add_value_head: false
    openpi:
      config_name: pi05_libero
      detach_critic_input: true
  optim:
    lr: 5.0e-6
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    warmup_style: cosine
    lr_warmup_steps: 25
    total_training_steps: 500
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    use_orig_params: false
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
