# Few-shot SFT recipe for LIBERO-Spatial task 6.
# The base model is the public RLinf π0.5 LIBERO SFT checkpoint.  This recipe
# fine-tunes its action expert using exactly 20 fixed task-6 demonstrations.
defaults:
  - model/pi0_5@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: 0-0

runner:
  task_type: sft
  logger:
    log_path: /path/to/output
    project_name: pi05-libero-task6
    experiment_name: task6_sft20
    logger_backends: ["tensorboard"]
  max_epochs: -1
  max_steps: 500
  val_check_interval: -1
  save_interval: 250

data:
  # A standalone, contiguous 20-episode LeRobot dataset created from the
  # fixed train split listed in docs/task6_20_9_split.csv.
  train_data_paths: /path/to/task6_train20

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 8
  global_batch_size: 8
  seed: 42
  model:
    precision: null
    model_path: /path/to/public_pi05_sft
    num_action_chunks: 4
    add_value_head: false
    openpi:
      config_name: pi05_libero
      detach_critic_input: true
  optim:
    # Conservative learning rate: this is a targeted adaptation of an
    # already-trained policy, not training a VLA model from scratch.
    lr: 5.0e-6
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 1.0e-10
    clip_grad: 1.0
    warmup_style: cosine
    lr_warmup_steps: 25
    total_training_steps: 500
  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    use_orig_params: false
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
